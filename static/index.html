<!DOCTYPE html>
<html>
  <head>
    <title>Sales Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
      body {
        font-family: sans-serif;
        padding: 2rem;
      }
      canvas {
        max-width: 100%;
        height: 400px;
      }
    </style>
  </head>
  <body>
    <div style="text-align: center;">
      <h1> Databricks Apps (NodeJS) </h1>
      <p style="color: #888; font-style: italic;">
        This is example using Github deployment.
      </p>
      <div style="background-color: #f0f8ff; padding: 1rem; border-radius: 8px; margin: 1rem 0;">
        <p style="color: #333; margin: 0;">📊 Welcome to your interactive sales dashboard! Monitor your daily performance with real-time data visualization.</p>
      </div>
    </div>
    <h2>📈 Sales Dashboard </h1>
    <canvas id="salesChart"></canvas>

    <script>
      async function renderChart() {
        const response = await fetch('/data');
        const data = await response.json();

        const ctx = document.getElementById('salesChart').getContext('2d');
        new Chart(ctx, {
          type: 'line',
          data: {
            labels: data.map((d) => d.date),
            datasets: [
              {
                label: 'Daily Sales',
                data: data.map((d) => d.sales),
                borderWidth: 2,
                fill: false,
              },
            ],
          },
          options: {
            responsive: true,
            scales: {
              y: {
                beginAtZero: true,
              },
            },
          },
        });
      }

      renderChart();
    </script>
    
    <footer style="text-align: center; margin-top: 3rem; padding: 1rem; background-color: #f8f9fa; border-radius: 8px;">
      <p style="color: #666; margin: 0; font-size: 0.9rem;">
        🚀 Powered by Node.js & Databricks | Built for modern data analytics
      </p>
    </footer>
  </body>
</html>
